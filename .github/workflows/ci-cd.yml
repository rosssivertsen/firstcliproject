# CI/CD Pipeline for FirstCLIProject
# Python-based automation and quality checks

name: CI/CD Pipeline

on:
  push:
    branches: [ main, staging, development ]
  pull_request:
    branches: [ main, staging, development ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # Quality Gates - Run on all branches
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Python scripts
        run: |
          echo "✅ Checking Python syntax..."
          python -m py_compile test_ollama_local.py
          python -m py_compile test_huggingface.py
          echo "✅ Python syntax check passed"

      - name: Verify scripts are executable
        run: |
          echo "✅ Checking script permissions..."
          test -x scripts/deploy.sh
          test -x scripts/configure-project.sh
          echo "✅ All scripts are executable"

      - name: Validate package.json
        run: |
          echo "✅ Validating package.json..."
          cat package.json | python -m json.tool > /dev/null
          echo "✅ package.json is valid JSON"

      - name: Check documentation
        run: |
          echo "✅ Verifying documentation..."
          test -f README.md
          test -f CHANGELOG.md
          test -f MODEL_USAGE.md
          echo "✅ All documentation files present"

  # Production Deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deploying to production environment"
          echo "✅ Production deployment completed"
          echo "📦 Version: $(cat package.json | python -c 'import sys, json; print(json.load(sys.stdin)["version"])')"

  # Branch Management
  branch-management:
    name: Branch Management
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update development branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin development
          git checkout development
          git merge main --no-edit
          git push origin development
          echo "✅ Development branch updated with main"

      - name: Update staging branch
        run: |
          git fetch origin staging
          git checkout staging
          git merge main --no-edit
          git push origin staging
          echo "✅ Staging branch updated with main"
